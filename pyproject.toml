[project]
name = "ai-bussiness-workflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marshal", email = "mutisimarshal@gmaail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-prebuilt>=1.1.0",
    "langsmith>=0.14.1",
    "mcp>=2.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-bussiness-workflow = "ai_bussiness_workflow.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
